<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NOIR Studio — Interactive Character Graph &amp; Multiversal Blueprint</title>
  <style>

:root {
  --font-sans: 'Segoe UI', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  --font-serif: Georgia, 'Times New Roman', serif;
  --font-prose: 'Newsreader', Georgia, 'Times New Roman', serif;
  --font-mono: 'Cascadia Code', 'JetBrains Mono', ui-monospace, Consolas, monospace;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
}

body[data-theme="racing"] {
  --surface-chrome: #0f1218;
  --surface-chrome-elevated: #151922;
  --surface-chrome-hover: #1d2330;
  --ink-on-chrome: #f1f5f9;
  --ink-muted-on-chrome: #94a3b8;
  --border-chrome: #252c3b;
  --border-chrome-strong: #343e52;
  --surface-canvas: #0b0d12;
  --surface-paper: #F7F4EC;
  --surface-paper-alt: #f0e8d8;
  --ink-on-paper: #16181d;
  --ink-muted-on-paper: #5c483b;
  --border-paper: #d7bda0;
  --accent-primary: #ffb07d;
  --accent-primary-strong: #f2a65e;
  --ink-on-accent: #0b0d12;
  --accent-secondary: #90e9cd;
  --port-lineage: #6cb4ee;
  --port-mind: #b4a7e5;
  --port-media: #f59e0b;
  --port-rel: #fb7185;
  --port-story: #90e9cd;
  --gp-cyan-glow: #45D8E6;
  --gp-gold-start: #FFC43D;
  --gp-gold-end: #FF8C1A;
  --danger: #f87171;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--surface-canvas);
  color: var(--ink-on-chrome);
  font: 13px/1.45 var(--font-sans);
  overflow: hidden;
}

/* Themed thin 6px dark-paddock scrollbars */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: #0d1118; }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 999px; }
::-webkit-scrollbar-thumb:hover { background: #f2a65e; }

.bp-app {
  display: grid;
  grid-template-rows: 52px minmax(0, 1fr) 28px;
  height: 100vh;
  overflow: hidden;
}

/* Top Cockpit Bar */
.bp-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: linear-gradient(180deg, #141923, #0f1218);
  border-bottom: 2px solid #f2a65e;
  z-index: 30;
}
.bp-brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.bp-brand img { height: 28px; width: auto; display: block; border-radius: 4px; }
.bp-brand-tag {
  padding: 2px 7px;
  border-radius: 4px;
  background: rgba(245, 166, 35, 0.16);
  border: 1px solid rgba(245, 166, 35, 0.5);
  color: #FFC43D;
  font: 700 10px/1.2 var(--font-mono);
  letter-spacing: 0.05em;
}
.bp-nav {
  display: flex;
  align-items: center;
  gap: 4px;
  overflow-x: auto;
}
.bp-tab {
  padding: 6px 11px;
  border-radius: 6px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--ink-muted-on-chrome);
  font: 600 12px/1.2 var(--font-sans);
  cursor: pointer;
  white-space: nowrap;
  transition: background-color 120ms ease, color 120ms ease, border-color 120ms ease;
}
.bp-tab:hover { background: var(--surface-chrome-hover); color: var(--ink-on-chrome); }
.bp-tab[aria-current="page"] {
  background: linear-gradient(135deg, #ffb07d, #f2a65e);
  color: #0b0d12;
  font-weight: 800;
  border-color: #ffd0a8;
}
.bp-top-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

.bp-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  border-radius: 6px;
  border: 1px solid var(--border-chrome-strong);
  background: var(--surface-chrome-elevated);
  color: var(--ink-on-chrome);
  font: 600 11.5px/1.2 var(--font-sans);
  cursor: pointer;
  white-space: nowrap;
}
.bp-btn:hover:not(:disabled) { border-color: var(--accent-primary); background: var(--surface-chrome-hover); }
.bp-btn:disabled { opacity: 0.42; cursor: not-allowed; }
.bp-btn.is-primary { background: linear-gradient(135deg, #ffb07d, #f2a65e); color: #0b0d12; border-color: #ffd0a8; font-weight: 800; }
.bp-btn.is-mint { background: rgba(144, 233, 205, 0.14); border-color: #90e9cd; color: #90e9cd; }
.bp-btn.is-violet { background: rgba(180, 167, 229, 0.16); border-color: #b4a7e5; color: #dcd4ff; }
.bp-btn.is-danger { background: rgba(248, 113, 113, 0.14); border-color: rgba(248, 113, 113, 0.55); color: #fca5a5; }
.bp-btn.is-active { border-color: #90e9cd; color: #90e9cd; background: rgba(144, 233, 205, 0.14); }
.bp-mini { padding: 3px 7px; font-size: 10.5px; border-radius: 5px; }

/* Main Body Grid */
.bp-main {
  display: grid;
  grid-template-columns: 224px minmax(0, 1fr);
  min-height: 0;
  overflow: hidden;
}
.bp-left-rail {
  background: var(--surface-chrome);
  border-right: 1px solid var(--border-chrome);
  padding: 12px 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow-y: auto;
}
.bp-rail-kicker { font: 700 10px/1.2 var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-muted-on-chrome); }
.bp-proj-title { font-weight: 800; font-size: 14px; color: #f8fafc; }
.bp-ep-list { display: grid; gap: 6px; }
.bp-ep-card {
  display: grid;
  gap: 3px;
  padding: 8px 9px;
  border-radius: 8px;
  border: 1px solid var(--border-chrome);
  background: var(--surface-chrome-elevated);
  color: var(--ink-on-chrome);
  text-align: left;
  cursor: pointer;
}
.bp-ep-card[aria-current="true"] { border-color: #90e9cd; background: #142724; }
.bp-ep-card strong { font-size: 12px; line-height: 1.25; }
.bp-ep-card small { font: 600 10.5px/1.2 var(--font-mono); color: var(--ink-muted-on-chrome); }
.bp-ep-link-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 6px;
  border-radius: 999px;
  background: rgba(144, 233, 205, 0.14);
  border: 1px solid rgba(144, 233, 205, 0.45);
  color: #90e9cd;
  font: 700 9.5px/1.1 var(--font-mono);
  width: fit-content;
}

.bp-stage-area {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  background: var(--surface-canvas);
}

/* Hero Banner Strip */
.bp-hero {
  position: relative;
  padding: 10px 18px;
  border-bottom: 1px solid var(--border-chrome);
  background-size: cover;
  background-position: center;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-shrink: 0;
}
.bp-hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, rgba(11, 13, 18, 0.92) 0%, rgba(11, 13, 18, 0.72) 55%, rgba(11, 13, 18, 0.88) 100%);
}
.bp-hero > * { position: relative; z-index: 1; }
.bp-hero-eyebrow { font: 700 10px/1.2 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: #ffb07d; }
.bp-hero h1 { margin: 2px 0 2px; font-size: 17px; color: #f8fafc; }
.bp-hero p { margin: 0; font-size: 12px; color: #cbd5e1; }
.bp-hero-stats { display: flex; gap: 8px; flex-shrink: 0; }
.bp-stat-box {
  padding: 5px 10px;
  border-radius: 7px;
  background: rgba(18, 22, 32, 0.84);
  border: 1px solid rgba(255, 255, 255, 0.14);
  text-align: center;
  min-width: 76px;
}
.bp-stat-box small { display: block; font: 700 9.5px/1.1 var(--font-mono); color: var(--ink-muted-on-chrome); text-transform: uppercase; }
.bp-stat-box strong { font: 800 13px/1.2 var(--font-mono); color: #f8fafc; }

/* Character Graph Switchyard Layout */
.cg-wrap {
  flex: 1 1 auto;
  min-height: 0;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  overflow: hidden;
}
.cg-subbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 7px 14px;
  background: #121720;
  border-bottom: 1px solid var(--border-chrome);
  flex-wrap: wrap;
}
.cg-subtabs { display: inline-flex; gap: 6px; align-items: center; }
.cg-subtab {
  padding: 5px 11px;
  border-radius: 6px;
  border: 1px solid var(--border-chrome);
  background: var(--surface-chrome-elevated);
  color: var(--ink-on-chrome);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.cg-subtab[aria-selected="true"] {
  background: #ffb07d;
  color: #0b0d12;
  border-color: #ffd0a8;
  font-weight: 800;
}

.cg-mode-switch {
  display: inline-flex;
  padding: 2px;
  border-radius: 7px;
  background: #0b0e14;
  border: 1px solid var(--border-chrome-strong);
  gap: 3px;
}
.cg-mode-btn {
  padding: 4px 10px;
  border-radius: 5px;
  border: 0;
  background: transparent;
  color: var(--ink-muted-on-chrome);
  font: 700 11px/1.2 var(--font-mono);
  cursor: pointer;
}
.cg-mode-btn[aria-pressed="true"] {
  background: #1a332d;
  color: #90e9cd;
  box-shadow: inset 0 0 0 1px rgba(144, 233, 205, 0.5);
}
.cg-mode-btn.is-global[aria-pressed="true"] {
  background: rgba(108, 180, 238, 0.18);
  color: #6cb4ee;
  box-shadow: inset 0 0 0 1px rgba(108, 180, 238, 0.55);
}

.cg-body {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 334px;
  min-height: 0;
  overflow: hidden;
}
.cg-canvas-col {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  min-width: 0;
  min-height: 0;
  background: #101719;
}
.cg-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 12px;
  background: #141c1e;
  border-bottom: 1px solid #2b3437;
  flex-wrap: wrap;
}
.cg-toolbar-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.cg-legend { display: flex; align-items: center; gap: 8px; font: 700 10px/1 var(--font-mono); color: #94a3b8; }
.cg-dot { display: inline-block; width: 8px; height: 8px; border-radius: 999px; margin-right: 3px; }

.cg-viewport {
  position: relative;
  overflow: auto;
  background-color: #101719;
  background-image: radial-gradient(#354346 1px, transparent 1px);
  background-size: 18px 18px;
}
.cg-stage {
  position: relative;
  width: 1200px;
  height: 820px;
  transform-origin: 0 0;
}
.cg-wires {
  position: absolute;
  inset: 0;
  width: 1200px;
  height: 820px;
  pointer-events: none;
  overflow: visible;
}
.cg-wire {
  fill: none;
  stroke-width: 2.4;
  opacity: 0.9;
}
.cg-wire.is-lineage { stroke: #6cb4ee; }
.cg-wire.is-story { stroke: #90e9cd; }
.cg-wire.is-mind { stroke: #b4a7e5; stroke-dasharray: 5 3; }
.cg-wire.is-media { stroke: #f59e0b; }
.cg-wire.is-rel { stroke: #fb7185; stroke-width: 2.6; }
.cg-wire.is-rel.is-super { stroke: #c084fc; stroke-dasharray: 7 3; }
.cg-wire.is-standby { stroke: #64748b; stroke-dasharray: 4 4; opacity: 0.55; }
.cg-wire.is-highlighted { stroke-width: 4; filter: drop-shadow(0 0 6px rgba(255, 196, 61, 0.8)); opacity: 1; }

/* Episode Memory Container */
.cg-memory-frame {
  position: absolute;
  border-radius: 14px;
  border: 2px dashed rgba(144, 233, 205, 0.58);
  background: linear-gradient(180deg, rgba(20, 44, 39, 0.34), rgba(15, 22, 28, 0.42));
  box-shadow: inset 0 0 28px rgba(144, 233, 205, 0.08);
  pointer-events: none;
}
.cg-memory-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 7px 12px;
  border-bottom: 1px solid rgba(144, 233, 205, 0.28);
  pointer-events: auto;
}
.cg-memory-title {
  font: 800 10.5px/1.2 var(--font-mono);
  letter-spacing: 0.06em;
  color: #90e9cd;
  text-transform: uppercase;
}
.cg-memory-link-btn {
  padding: 3px 8px;
  border-radius: 999px;
  border: 1px solid rgba(144, 233, 205, 0.6);
  background: rgba(16, 40, 35, 0.88);
  color: #90e9cd;
  font: 700 10px/1.1 var(--font-mono);
  cursor: pointer;
}
.cg-memory-link-btn:hover { background: #90e9cd; color: #0b0d12; }

/* Standby Multiverse Dock Frame */
.cg-standby-frame {
  position: absolute;
  border-radius: 12px;
  border: 1.5px dashed rgba(255, 176, 125, 0.48);
  background: rgba(24, 22, 20, 0.68);
}
.cg-standby-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 10px;
  border-bottom: 1px solid rgba(255, 176, 125, 0.24);
  font: 800 10px/1.2 var(--font-mono);
  color: #ffb07d;
  text-transform: uppercase;
}

/* Graph Nodes */
.cg-node {
  position: absolute;
  border-radius: 10px;
  background: #1b2228;
  border: 1.5px solid #354349;
  color: #f6ead8;
  box-shadow: 0 10px 24px rgba(0, 0, 0, 0.44);
  cursor: grab;
  transition: border-color 120ms ease, box-shadow 120ms ease;
  user-select: none;
}
.cg-node:hover { border-color: #6cb4ee; }
.cg-node.is-selected { border-color: #FFC43D; box-shadow: 0 0 0 2px rgba(255, 196, 61, 0.4), 0 12px 26px rgba(0, 0, 0, 0.55); }
.cg-node.is-universal { border-color: #b4a7e5; background: linear-gradient(180deg, #1d1a2e, #151924); }
.cg-node.is-anchor { border-color: #6cb4ee; }
.cg-node.is-active-fork { border-color: #90e9cd; }
.cg-node.is-standby { border-color: #475569; opacity: 0.92; }
.cg-node.is-locked { border-color: #ef4444; opacity: 0.72; }
.cg-node.is-super { border-color: #c084fc; background: linear-gradient(180deg, #231836, #161524); }
.cg-node.is-media-node { border-color: #f59e0b; background: #211c14; }
.cg-node.is-peer { border-color: #fb7185; background: #221820; }
.cg-node.is-drop-accept { border-color: #90e9cd; box-shadow: 0 0 0 3px rgba(144, 233, 205, 0.45); }

.cg-node-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 5px;
  padding: 4px 8px;
  border-radius: 8px 8px 0 0;
  background: #141b1f;
  border-bottom: 1px solid #2a363c;
  font: 700 9.5px/1.2 var(--font-mono);
  letter-spacing: 0.05em;
  color: #cbd5e1;
}
.cg-node.is-universal .cg-node-head { background: #261e42; color: #dcd4ff; }
.cg-node.is-active-fork .cg-node-head { background: #16332c; color: #90e9cd; }
.cg-node.is-super .cg-node-head { background: #331c4a; color: #e9d5ff; }
.cg-node.is-media-node .cg-node-head { background: #362512; color: #fcd34d; }
.cg-node.is-peer .cg-node-head { background: #381826; color: #fda4af; }

.cg-node-head-btns { display: inline-flex; align-items: center; gap: 3px; }
.cg-icon-btn {
  border: 1px solid rgba(255, 255, 255, 0.16);
  background: rgba(15, 18, 24, 0.7);
  color: #e2e8f0;
  border-radius: 4px;
  padding: 1px 5px;
  font: 700 9.5px/1.2 var(--font-mono);
  cursor: pointer;
}
.cg-icon-btn:hover { border-color: #ffb07d; color: #ffb07d; }
.cg-icon-btn.is-del:hover { border-color: #f87171; color: #fca5a5; }

.cg-node-body {
  display: grid;
  grid-template-columns: 46px minmax(0, 1fr);
  gap: 8px;
  padding: 8px;
  align-items: start;
}
.cg-node-body.no-thumb { grid-template-columns: minmax(0, 1fr); }
.cg-thumb-box {
  position: relative;
  width: 46px;
  height: 46px;
  border-radius: 7px;
  overflow: hidden;
  border: 1px solid #3c4850;
  background: #0f1419;
  display: flex;
  align-items: center;
  justify-content: center;
  font: 800 12px/1 var(--font-mono);
  color: #94a3b8;
}
.cg-thumb-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cg-thumb-actions {
  position: absolute;
  inset: 0;
  background: rgba(11, 13, 18, 0.82);
  display: none;
  align-items: center;
  justify-content: center;
  gap: 2px;
}
.cg-thumb-box:hover .cg-thumb-actions { display: flex; }
.cg-thumb-mini {
  border: 0;
  background: rgba(255, 255, 255, 0.14);
  color: #fff;
  font-size: 9px;
  padding: 2px 4px;
  border-radius: 3px;
  cursor: pointer;
}
.cg-thumb-mini.is-clear { background: rgba(239, 68, 68, 0.65); }

.cg-node-info { min-width: 0; display: grid; gap: 3px; }
.cg-node-info strong { font-size: 12px; line-height: 1.22; color: #f8fafc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cg-node-info small { font-size: 10.5px; line-height: 1.25; color: #b8a998; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cg-tag-pill {
  display: inline-flex;
  align-items: center;
  padding: 1px 6px;
  border-radius: 4px;
  background: rgba(108, 180, 238, 0.14);
  border: 1px solid rgba(108, 180, 238, 0.45);
  color: #93c5fd;
  font: 700 9.5px/1.2 var(--font-mono);
  width: fit-content;
}
.cg-badge {
  display: inline-flex;
  align-items: center;
  padding: 1px 6px;
  border-radius: 999px;
  font: 700 9.5px/1.2 var(--font-mono);
  border: 1px solid #354040;
  background: #141a1e;
  color: #cbd5e1;
}
.cg-badge.is-mint { border-color: rgba(144, 233, 205, 0.55); color: #90e9cd; background: rgba(144, 233, 205, 0.12); }
.cg-badge.is-copper { border-color: rgba(255, 176, 125, 0.55); color: #ffb07d; background: rgba(255, 176, 125, 0.12); }
.cg-badge.is-violet { border-color: rgba(180, 167, 229, 0.6); color: #dcd4ff; background: rgba(180, 167, 229, 0.14); }
.cg-badge.is-red { border-color: rgba(248, 113, 113, 0.6); color: #fca5a5; background: rgba(248, 113, 113, 0.14); }

.cg-node-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  padding: 4px 8px 6px;
  border-top: 1px solid rgba(255, 255, 255, 0.06);
  flex-wrap: wrap;
}

/* Typed Ports on Nodes */
.cg-port {
  position: absolute;
  width: 11px;
  height: 11px;
  border-radius: 999px;
  border: 2px solid #0b0d12;
  cursor: crosshair;
  z-index: 4;
}
.cg-port.is-lineage-in { top: -6px; left: 50%; transform: translateX(-50%); background: var(--port-lineage); }
.cg-port.is-lineage-out { bottom: -6px; left: 50%; transform: translateX(-50%); background: var(--port-lineage); }
.cg-port.is-mind { left: -6px; bottom: 18px; background: var(--port-mind); }
.cg-port.is-media { right: -6px; bottom: 18px; background: var(--port-media); }
.cg-port.is-rel-left { left: -6px; top: 36px; background: var(--port-rel); }
.cg-port.is-rel-right { right: -6px; top: 36px; background: var(--port-rel); }
.cg-port.is-story-port { right: 18px; bottom: -6px; background: var(--port-story); }
.cg-port.is-wiring-source { box-shadow: 0 0 0 4px rgba(251, 113, 133, 0.55); transform: scale(1.25); }

/* Edge Midpoint Pills */
.cg-edge-pill {
  position: absolute;
  transform: translate(-50%, -50%);
  padding: 2px 7px;
  border-radius: 999px;
  border: 1px solid rgba(251, 113, 133, 0.65);
  background: rgba(22, 16, 24, 0.92);
  color: #fda4af;
  font: 700 9.5px/1.2 var(--font-mono);
  cursor: pointer;
  z-index: 5;
  white-space: nowrap;
}
.cg-edge-pill.is-super { border-color: rgba(192, 132, 252, 0.75); color: #e9d5ff; }
.cg-edge-pill.is-active { box-shadow: 0 0 0 2px rgba(255, 196, 61, 0.7); color: #FFC43D; }

/* Right Inspector */
.cg-inspector {
  background: #101719;
  border-left: 1px solid #2b3437;
  padding: 10px;
  overflow-y: auto;
  display: grid;
  gap: 10px;
  align-content: start;
}
.cg-insp-card {
  background: #161e21;
  border: 1px solid #2b3437;
  border-radius: 9px;
  padding: 10px;
  display: grid;
  gap: 7px;
}
.cg-insp-card h3 {
  margin: 0;
  font: 800 10.5px/1.2 var(--font-mono);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #ffb07d;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.cg-rel-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 6px;
  align-items: center;
  padding: 6px 8px;
  border-radius: 6px;
  border: 1px solid #2d383c;
  background: #12181b;
  color: #e2e8f0;
  cursor: pointer;
  text-align: left;
  font-size: 11px;
}
.cg-rel-row.is-active { border-color: #90e9cd; background: #162b26; }
.cg-input, .cg-select, .cg-textarea {
  width: 100%;
  padding: 6px 8px;
  border-radius: 6px;
  border: 1px solid #334155;
  background: #0b0e14;
  color: #f1f5f9;
  font: 12px/1.4 var(--font-sans);
}
.cg-textarea { resize: vertical; }

/* Houdini Breadcrumb Interior View */
.cg-interior-wrap {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding: 16px 20px 28px;
  background: radial-gradient(circle at top right, rgba(108, 180, 238, 0.07), transparent 40%), #0e1417;
  display: grid;
  gap: 14px;
  align-content: start;
}
.cg-crumb-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 12px;
  border-radius: 9px;
  background: #151c22;
  border: 1px solid #2b3842;
}
.cg-crumbs { display: flex; align-items: center; gap: 8px; font: 700 12px/1.2 var(--font-mono); }
.cg-crumb-link { background: transparent; border: 0; color: #90e9cd; font: inherit; cursor: pointer; padding: 0; }
.cg-crumb-link:hover { text-decoration: underline; }
.cg-interior-grid {
  display: grid;
  grid-template-columns: 320px minmax(0, 1fr);
  gap: 14px;
  align-items: start;
}
@media (max-width: 1120px) { .cg-interior-grid { grid-template-columns: 1fr; } }

.cg-panel {
  background: #151c22;
  border: 1px solid #283440;
  border-radius: 10px;
  padding: 14px;
  display: grid;
  gap: 10px;
}
.cg-panel h2 { margin: 0; font-size: 14px; color: #ffb07d; display: flex; align-items: center; justify-content: space-between; }

/* Wardrobe Semantics Cards */
.cg-wardrobe-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 10px;
}
.cg-wardrobe-card {
  background: #0f1419;
  border: 1px solid #334155;
  border-radius: 9px;
  padding: 10px;
  display: grid;
  gap: 7px;
}
.cg-wardrobe-card img { width: 100%; height: 118px; object-fit: cover; border-radius: 6px; border: 1px solid #2b3440; }

/* Story Graph L1-L3, Timeline, Compose, Word Prep, Home */
.sg-l123-shell { flex: 1 1 auto; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
.tl-wrap, .cmp-wrap, .wp-wrap, .hm-wrap { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 16px 20px; }
.tl-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-top: 12px; }
.tl-card {
  background: var(--gp-card-cream, #F8F5EE);
  color: #16181d;
  border: 2px solid #d7bda0;
  border-radius: 12px;
  padding: 12px;
  display: grid;
  gap: 8px;
}
.tl-card.is-active { border-color: #10B981; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.28); }
.tl-card-cover {
  position: relative;
  height: 124px;
  border-radius: 8px;
  background: #141923;
  color: #ffb07d;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border: 1px solid #334155;
}
.tl-card-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tl-mem-badge {
  padding: 4px 8px;
  border-radius: 6px;
  background: #0f2922;
  color: #90e9cd;
  font: 700 10.5px/1.2 var(--font-mono);
}

.cmp-sheet {
  max-width: 880px;
  margin: 0 auto;
  background: #F7F4EC;
  color: #16181d;
  border: 1px solid #d3c1a5;
  border-radius: 10px;
  padding: 18px 22px;
  display: grid;
  gap: 12px;
}
.cmp-block {
  padding: 10px 12px;
  border-radius: 7px;
  border: 1px solid #e2d5be;
  background: #fcf9f2;
  display: grid;
  gap: 5px;
}
.cmp-lock { background: #d7f3df; border-bottom: 2px solid #10b981; color: #064e3b; padding: 1px 5px; border-radius: 3px; }

/* Drop Tray & Toast */
.cg-drop-tray {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  background: #12181b;
  border-top: 1px solid #2b3437;
  font: 600 11px/1.2 var(--font-mono);
  color: #94a3b8;
  overflow-x: auto;
}
.cg-chip {
  padding: 3px 8px;
  border-radius: 999px;
  border: 1px solid rgba(255, 176, 125, 0.5);
  background: #221b15;
  color: #ffb07d;
  cursor: grab;
  white-space: nowrap;
}
.bp-toast {
  position: fixed;
  bottom: 38px;
  right: 18px;
  z-index: 90;
  padding: 9px 14px;
  border-radius: 8px;
  border: 1px solid #90e9cd;
  background: rgba(15, 20, 28, 0.96);
  color: #90e9cd;
  font: 700 11.5px/1.3 var(--font-mono);
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
}
.bp-toast.is-err { border-color: #f87171; color: #fca5a5; }

/* Modals / Drawers */
.bp-modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 80;
  background: rgba(6, 9, 14, 0.78);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.bp-modal {
  width: min(980px, 100%);
  max-height: 86vh;
  background: #141923;
  border: 1.5px solid #343e52;
  border-radius: 12px;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  overflow: hidden;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
}
.bp-modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-chrome);
  background: #0f1218;
}
.bp-modal-body { padding: 16px; overflow-y: auto; display: grid; gap: 12px; align-content: start; }
.bp-code-pre {
  margin: 0;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid #283347;
  background: #080b10;
  color: #cbd5e1;
  font: 11px/1.45 var(--font-mono);
  white-space: pre-wrap;
  max-height: 280px;
  overflow: auto;
}

.bp-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  background: #0b0e14;
  border-top: 1px solid var(--border-chrome);
  font: 600 10.5px/1 var(--font-mono);
  color: var(--ink-muted-on-chrome);
}

  </style>

let state = createInitialState();
const undoStack = [];
const redoStack = [];
let toastTimer = null;

function clone(v) { return JSON.parse(JSON.stringify(v)); }

function showToast(text, isErr = false) {
  state.toast = { text, isErr };
  renderToastOnly();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    state.toast = null;
    renderToastOnly();
  }, 3400);
}

function renderToastOnly() {
  let el = document.getElementById('bpToastEl');
  if (!state.toast) {
    if (el) el.remove();
    return;
  }
  if (!el) {
    el = document.createElement('div');
    el.id = 'bpToastEl';
    document.body.appendChild(el);
  }
  el.className = 'bp-toast' + (state.toast.isErr ? ' is-err' : '');
  el.textContent = state.toast.text;
}

function commit(label, mutator) {
  const snap = clone(state);
  snap.toast = null;
  undoStack.push({ label, snap });
  if (undoStack.length > 60) undoStack.shift();
  redoStack.length = 0;
  mutator(state);
  render();
  showToast('✓ ' + label);
}

function performUndo() {
  if (!undoStack.length) return;
  const entry = undoStack.pop();
  const currentSnap = clone(state);
  currentSnap.toast = null;
  redoStack.push({ label: entry.label, snap: currentSnap });
  state = entry.snap;
  render();
  showToast('↩ Undid: ' + entry.label);
}

function performRedo() {
  if (!redoStack.length) return;
  const entry = redoStack.pop();
  const currentSnap = clone(state);
  currentSnap.toast = null;
  undoStack.push({ label: entry.label, snap: currentSnap });
  state = entry.snap;
  render();
  showToast('↪ Redid: ' + entry.label);
}

function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function allRelationships() {
  const base = state.relationships || [];
  if (!state.superNodePlugged) return base;
  return [...base, ...(state.superNodePackage.bundled_relationships || [])];
}

function activeNodesList() {
  const list = Object.values(state.nodes).filter((n) => !n.deleted);
  if (state.graphMode === 'episodic' && state.standbyCollapsed) {
    return list.filter((n) => n.status !== 'STANDBY' && n.status !== 'LOCKED_FUTURE');
  }
  return list;
}

function nodeCoords(n) {
  if (state.graphMode === 'global') {
    return { x: n.gx ?? n.x, y: n.gy ?? n.y };
  }
  return { x: n.x, y: n.y };
}

function softDeleteNode(nodeId) {
  const node = state.nodes[nodeId];
  if (!node || node.deleted) return;
  commit('Soft-delete ' + node.title, (s) => {
    const attachedRels = [];
    s.relationships = s.relationships.filter((r) => {
      if (r.fromId === nodeId || r.toId === nodeId) {
        attachedRels.push(clone(r));
        return false;
      }
      return true;
    });
    s.nodes[nodeId].deleted = true;
    s.trash.unshift({
      trashId: 'tr_' + Date.now() + '_' + Math.random().toString(16).slice(2, 6),
      kind: 'node',
      title: node.title,
      nodeId,
      attachedRels,
      deletedAt: new Date().toLocaleTimeString(),
    });
    if (s.selectedNodeId === nodeId) s.selectedNodeId = 'form_big_butt';
  });
}

function softDeleteRelationship(relId) {
  const idx = state.relationships.findIndex((r) => r.id === relId);
  if (idx < 0) return;
  const rel = state.relationships[idx];
  commit('Soft-delete relationship ' + rel.label, (s) => {
    s.relationships.splice(idx, 1);
    s.trash.unshift({
      trashId: 'tr_' + Date.now(),
      kind: 'relationship',
      title: rel.label,
      rel: clone(rel),
      deletedAt: new Date().toLocaleTimeString(),
    });
    if (s.selectedEdgeId === relId) s.selectedEdgeId = s.relationships[0]?.id || '';
  });
}

function restoreTrashItem(trashId) {
  const idx = state.trash.findIndex((t) => t.trashId === trashId);
  if (idx < 0) return;
  const item = state.trash[idx];
  commit('Restore ' + item.title, (s) => {
    s.trash.splice(idx, 1);
    if (item.kind === 'node') {
      if (s.nodes[item.nodeId]) s.nodes[item.nodeId].deleted = false;
      for (const r of item.attachedRels || []) {
        if (!s.relationships.some((x) => x.id === r.id)) s.relationships.push(r);
      }
      s.selectedNodeId = item.nodeId;
    } else if (item.kind === 'relationship') {
      if (!s.relationships.some((x) => x.id === item.rel.id)) s.relationships.push(item.rel);
      s.selectedEdgeId = item.rel.id;
    } else if (item.kind === 'episode') {
      if (!s.episodes.some((e) => e.id === item.ep.id)) s.episodes.splice(item.index || 0, 0, item.ep);
      s.activeEpisodeId = item.ep.id;
    } else if (item.kind === 'media_item') {
      s.mediaSubgraph.push(item.item);
    } else if (item.kind === 'junction') {
      if (s.nodes[item.nodeId]) s.nodes[item.nodeId].deleted = false;
      if (item.importedEntry && !s.importedJunctions.some((j) => j.id === item.importedEntry.id)) {
        s.importedJunctions.push(item.importedEntry);
      }
    }
  });
}

function renderCharacterGraphView() {
  if (state.interiorStack.length) {
    return `
      <div class="cg-wrap">
        ${renderGraphInterior()}
      </div>
    `;
  }

  const visibleNodes = activeNodesList();
  const nodeMap = new Map(visibleNodes.map((n) => [n.id, n]));
  const rels = allRelationships().filter((r) => nodeMap.has(r.fromId) && nodeMap.has(r.toId));
  const selNode = nodeMap.get(state.selectedNodeId) || visibleNodes[0];
  const selEdge = rels.find((r) => r.id === state.selectedEdgeId) || rels[0] || null;

  // Compute wires
  const wires = [];
  const addWire = (fromId, toId, cls, label = '') => {
    const a = nodeMap.get(fromId);
    const b = nodeMap.get(toId);
    if (!a || !b) return;
    const ac = nodeCoords(a);
    const bc = nodeCoords(b);
    const x1 = ac.x + a.w / 2;
    const y1 = ac.y + 84;
    const x2 = bc.x + b.w / 2;
    const y2 = bc.y;
    const dy = Math.max(28, Math.abs(y2 - y1) * 0.45);
    wires.push({ d: `M ${x1} ${y1} C ${x1} ${y1 + dy}, ${x2} ${y2 - dy}, ${x2} ${y2}`, cls, label });
  };

  addWire('universal_rainee', 'anchor_rainee_ling', 'is-lineage');
  addWire('anchor_rainee_ling', 'form_big_butt', 'is-lineage');
  if (state.graphMode === 'global') {
    addWire('anchor_rainee_ling', 'form_bird_girl', 'is-standby');
    addWire('anchor_rainee_ling', 'form_cartoon_blonde', 'is-standby');
    addWire('anchor_rainee_ling', 'form_haley_locked', 'is-standby');
  }
  const starterA = state.branchRouting.branch_a || 'form_big_butt';
  const starterB = state.branchRouting.branch_b || 'form_big_butt';
  addWire(nodeMap.has(starterA) ? starterA : 'form_big_butt', 'branch_a', 'is-story');
  addWire(nodeMap.has(starterB) ? starterB : 'form_big_butt', 'branch_b', 'is-story');
  addWire('branch_a', 'resolved_preview', 'is-story');
  addWire('branch_b', 'resolved_preview', 'is-story');
  addWire('mind_peter_node', 'branch_a', 'is-mind');
  addWire('media_hub', 'branch_b', 'is-media');
  for (const j of state.importedJunctions) {
    if (nodeMap.has(j.nodeId)) addWire(j.routedFormId || 'form_big_butt', j.nodeId, 'is-story');
  }
  if (state.superNodePlugged && nodeMap.has('super_bbl_node')) {
    addWire('super_bbl_node', 'form_big_butt', 'is-mind');
  }

  // Relationship horizontal wires + midpoint pills
  const relWires = rels.map((r) => {
    const a = nodeMap.get(r.fromId);
    const b = nodeMap.get(r.toId);
    const ac = nodeCoords(a);
    const bc = nodeCoords(b);
    const x1 = ac.x > bc.x ? ac.x : ac.x + a.w;
    const y1 = ac.y + 42;
    const x2 = ac.x > bc.x ? bc.x + b.w : bc.x;
    const y2 = bc.y + 42;
    const cx = (x1 + x2) / 2;
    const cy = (y1 + y2) / 2;
    return {
      rel: r,
      d: `M ${x1} ${y1} C ${cx} ${y1}, ${cx} ${y2}, ${x2} ${y2}`,
      mx: cx,
      my: cy,
    };
  });

  const resolvedTitleA = resolveBranchFormLabel('branch_a');
  const resolvedTitleB = resolveBranchFormLabel('branch_b');
  if (state.nodes.resolved_preview) {
    state.nodes.resolved_preview.subtitle = `A: ${resolvedTitleA} | B: ${resolvedTitleB}${state.superNodePlugged ? ' + BBL Pro Max' : ''}`;
  }

  return `
    <div class="cg-wrap">
      <div class="cg-subbar">
        <div class="cg-subtabs" role="tablist">
          <button type="button" class="cg-subtab" data-cg-subtab="switchyard" aria-selected="${state.graphSubtab === 'switchyard'}">Form Switchyard</button>
          <button type="button" class="cg-subtab" data-cg-subtab="junctions" aria-selected="${state.graphSubtab === 'junctions'}">Character Junctions (${Object.values(state.nodes).filter((n) => !n.deleted && (n.kind === 'form' || n.kind === 'junction')).length})</button>
        </div>
        <div class="cg-mode-switch" role="group" aria-label="Dual Character Graph Mode">
          <button type="button" class="cg-mode-btn is-global" data-cg-mode="global" aria-pressed="${state.graphMode === 'global'}">🌐 Global Character Graph (Master Vault)</button>
          <button type="button" class="cg-mode-btn" data-cg-mode="episodic" aria-pressed="${state.graphMode === 'episodic'}">🎬 Episodic Graph (Ep 02: Spring Break)</button>
        </div>
      </div>

      ${state.graphSubtab === 'junctions' ? `
        <div style="padding:16px 20px;overflow-y:auto;display:grid;gap:12px;align-content:start;">
          <h2 style="margin:0;font-size:15px;color:#ffb07d;">Character Form Junctions &amp; Availability Gates (story_graph/character_forms.py parity)</h2>
          <div class="cg-wardrobe-grid">
            ${Object.values(state.nodes).filter((n) => !n.deleted && (n.kind === 'form' || n.kind === 'junction' || n.kind === 'super')).map((f) => {
              const effStatus = f.id === 'form_haley_locked' && state.timeTravelOverride ? 'TIME_TRAVEL_UNLOCKED' : f.status;
              return `
                <div class="cg-wardrobe-card">
                  <div style="display:flex;justify-content:space-between;align-items:center;">
                    <span class="cg-tag-pill">[TAG: ${esc(f.tag)}]</span>
                    <span class="cg-badge ${effStatus === 'ACTIVE' ? 'is-mint' : effStatus === 'LOCKED_FUTURE' ? 'is-red' : 'is-copper'}">${esc(effStatus)}</span>
                  </div>
                  ${f.portrait ? `<img src="${esc(f.portrait)}" alt="${esc(f.title)}">` : ''}
                  <strong style="color:#f8fafc;">${esc(f.title)}</strong>
                  <small style="color:#94a3b8;">${esc(f.subtitle)}</small>
                  <div style="display:flex;gap:5px;flex-wrap:wrap;">
                    <button type="button" class="bp-btn bp-mini" data-open-interior="character:${esc(f.id)}">Interior ↗</button>
                    ${f.status === 'STANDBY' ? `<button type="button" class="bp-btn bp-mini is-mint" data-route-branch="branch_a:${esc(f.id)}">Route → A</button><button type="button" class="bp-btn bp-mini is-mint" data-route-branch="branch_b:${esc(f.id)}">Route → B</button>` : ''}
                  </div>
                </div>
              `;

          </div>
        </div>
      ` : `

              <button type="button" class="bp-btn bp-mini" id="cgAddRelBtn">+ Relationship</button>
              <button type="button" class="bp-btn bp-mini is-violet ${state.superNodePlugged ? 'is-active' : ''}" id="cgPlugSuperBtn">${state.superNodePlugged ? '⚡ Unplug BBL Pro Max' : '⚡ Plug Super Node'}</button>
              ${state.graphMode === 'episodic' ? `<button type="button" class="bp-btn bp-mini" id="cgToggleStandbyBtn">${state.standbyCollapsed ? 'Show Standby Forms' : 'Hide Standby Forms'}</button>` : ''}

              <button type="button" class="bp-btn bp-mini" id="cgZoomOut">-</button>

          ${state.showAddJunctionBar ? `

          ${state.showAddRelBar ? `

              <button type="button" class="bp-btn bp-mini" id="cgCancelRelBtn">Cancel</button>
            </div>
          ` : ''}

          <div class="cg-viewport" id="cgViewport">
            <div class="cg-stage" id="cgStage" style="transform: scale(${state.zoom});">
              ${state.graphMode === 'episodic' ? `
                <div class="cg-memory-frame" style="left:174px; top:418px; width:576px; height:196px;">
                  <div class="cg-memory-head">
                    <span class="cg-memory-title">EPISODE MEMORY CONTAINER · Tied to Episode: Spring Break (Ep 02)</span>

              <svg class="cg-wires" viewBox="0 0 1200 820">

                ${relWires.map((rw) => {

              ${relWires.map((rw) => `

              ${visibleNodes.map((n) => {

  else if (state.view === 'compose') stageHtml = renderComposeView();
  else stageHtml = renderHomeOrPrepView();

  root.innerHTML = `
    ${renderTopbar()}
    <div class="bp-main">
      ${renderLeftRail()}
      <main class="bp-stage-area">
        ${renderHero()}
        ${stageHtml}
      </main>
    </div>
    <footer class="bp-footer">
      <span>NOIR Planning Blueprint · Zero Hard Deletes · Open Super-Node Contract</span>
      <span>Undo: ${undoStack.length} · Redo: ${redoStack.length} · Trash: ${state.trash.length}</span>
    </footer>
    ${renderModal()}
  `;
  bindDomEvents();
  renderToastOnly();
}

function triggerImagePicker(onDataUrl) {
  const inp = document.getElementById('bpHiddenFileInput');
  inp.accept = 'image/png,image/jpeg,image/webp,image/gif';
  inp.value = '';
  inp.onchange = () => {
    const file = inp.files?.[0];
    if (!file) return;
    if (file.size > 2_000_000) {
      showToast('Choose an image under 2 MB.', true);
      return;
    }
    const reader = new FileReader();
    reader.onload = () => onDataUrl(String(reader.result));
    reader.readAsDataURL(file);
  };
  inp.click();
}

function createSyncedStoryJunction(title) {
  commit('Add Story Junction "' + title + '" (synced to Episodic Graph)', (s) => {
    const num = s.storyBeats.length + 1;
    const beatId = 'B0' + num;
    const nodeId = 'junction_' + Date.now();
    s.storyBeats.push({
      id: beatId, branch: 'G' + num, title, summary: 'Auto-synced Story Junction.',
      text: '## ' + title + '\nNew junction beat synced from Story Graph.',
    });
    const offset = s.importedJunctions.length * 265;
    s.nodes[nodeId] = {
      id: nodeId, kind: 'junction', tier: 'IMPORTED JUNCTION', tag: 'JUNCTION_' + num,
      title, subtitle: 'Auto-imported from Story Graph (' + beatId + ')',
      portrait: '', status: 'ACTIVE', x: 190 + offset, y: 580, w: 246, gx: 800, gy: 630, attachments: [],
    };
    s.importedJunctions.push({ id: beatId, nodeId, title, routedFormId: 'form_big_butt' });
  });
}

function softDeleteEpisode(eid) {
  const idx = state.episodes.findIndex((e) => e.id === eid);
  if (idx < 0) return;
  const ep = state.episodes[idx];
  commit('Soft-delete ' + ep.title, (s) => {
    const [removed] = s.episodes.splice(idx, 1);
    s.trash.unshift({ trashId: 'tr_' + Date.now(), kind: 'episode', title: removed.title, ep: removed, index: idx, deletedAt: new Date().toLocaleTimeString() });
    if (s.activeEpisodeId === eid) s.activeEpisodeId = s.episodes[0]?.id || '';
  });
}

function moveEpisodeEarlier(eid) {
  const idx = state.episodes.findIndex((e) => e.id === eid);
  if (idx <= 0) return;
  commit('Move episode earlier', (s) => {
    const [ep] = s.episodes.splice(idx, 1);
    s.episodes.splice(idx - 1, 0, ep);
  });
}

// Global Atomic Ctrl+Z / Ctrl+Y with mandatory Input-Focus Guard
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (state.modal) { state.modal = null; render(); return; }
    if (state.interiorStack.length) { state.interiorStack.pop(); render(); return; }
  }
  const tag = (e.target && e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || (e.target && e.target.isContentEditable)) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) {
    e.preventDefault();
    performUndo();
  } else if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey))) {
    e.preventDefault();
    performRedo();
  }
});
