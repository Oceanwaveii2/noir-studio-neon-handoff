<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Processing graph · Noir</title>
  <link rel="stylesheet" href="/assets/processing.css">
  <script type="module" src="/assets/processing.js"></script>
</head>
<body>
  <header class="bar"><strong class="wordmark">NOIR</strong><a id="story" href="/v2?view=timeline&amp;track=story">← Story Beats</a></header>
  <main>
    <div class="page-title"><div><p class="scope" id="scope"></p><h1>Processing graph</h1></div><span id="connection" class="badge" role="status">Connecting</span></div>
    <div class="workspace">
      <aside class="panel job-list" aria-label="Recent jobs">
        <h2>Recent jobs</h2>
        <div id="jobs"></div>
      </aside>
      <div class="stack">
        <section class="panel" aria-label="Job stages">
          <header class="panel-title"><h2 id="job-title">Job stages</h2><span class="badge" id="job-state" hidden></span></header>
          <p id="graph-empty" class="hint">Waiting for a job in this episode.</p>
          <ol id="graph" class="graph" aria-label="Processing stages"></ol>
        </section>
        <section class="panel" aria-label="Step details">
          <h2 id="step-title">Step details</h2>
          <p id="step-status" class="hint">Select a step to see its receipt.</p>
          <div id="details" class="details"></div>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
